# The documentation site of the clang-retro changes to JWlink:
# https://clang-retro.github.io/JWlink/
# Build it with `pip install -r .docs/requirements.txt` and `mkdocs serve`
# in this directory.
INHERIT: .docs/base.yml
site_name: clang-retro JWlink
site_description: The linker for clang-retro's DOS, Windows and OS/2 programs, and what the fork changes
site_url: https://clang-retro.github.io/JWlink/
repo_url: https://github.com/clang-retro/JWlink
repo_name: clang-retro/JWlink
edit_uri: ""
copyright: Copyright &copy; clang-retro contributors &middot; Sybase Open Watcom Public License
hooks:
  - .docs/hooks.py

extra:
  retro:
    doxygen: clang-retro-docs/.docs/Doxyfile
    root: ..
    github: clang-retro/JWlink
    branch: master

nav:
  - Home: index.md
  - Changes: changes.md
  - Building: building.md
  - API reference: api/index.html
  - All clang-retro projects: https://clang-retro.github.io/
